<style>
/* Frame = Mesura v1.0 itself, so the reel is on-brand before any chapter departs from it.
   Layout: one long reel. The frame is paper; each chapter is a full-bleed world with a fixed palette of its own. */
:root {
  --paper: #F2EDE3; --paper-sunken: #EAE4D6; --surface: #FFFFFF;
  --border: #E3DCCC; --border-strong: #D3CBB9;
  --ink: #22362F; --ink-body: #45534D; --ink-muted: #6E7A73; --ink-faint: #A5A199;
  --pine: #1D4A43; --pine-hover: #163B35; --pine-soft: #DCE5DF; --on-pine: #F6F2E9;
  --ochre: #D19C3F; --ochre-hover: #BC8A33; --ochre-soft: #F3E6C9; --on-ochre: #3B2E12;
  --logo-mark: #E1A23C; --logo-word: #073D44;
  --positive: #2E7D5B; --caution: #B07C2A; --negative: #A94436; --info: #3D6B8E;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-body: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 24px; --radius-pill: 999px;
  --shadow-sm: 0 1px 2px rgba(34,54,47,.06); --shadow-md: 0 4px 16px rgba(34,54,47,.08); --shadow-lg: 0 12px 32px rgba(34,54,47,.12);
  --ease: cubic-bezier(.4,0,.2,1); --ease-out: cubic-bezier(.16,1,.3,1);
  --gutter: clamp(16px, 4vw, 40px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #15211D; --paper-sunken: #101A17; --surface: #1D2C27; --border: #2B3D37; --border-strong: #3A4F48;
    --ink: #EFEAE0; --ink-body: #C2CAC4; --ink-muted: #8D9891; --ink-faint: #66716B;
    --pine: #EFEAE0; --pine-hover: #FFFFFF; --pine-soft: #24352F; --on-pine: #172621;
    --ochre: #DFAC52; --ochre-hover: #E9BC6E; --ochre-soft: #35301F; --on-ochre: #1C1608;
    --logo-word: #EFEAE0;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow-md: 0 4px 16px rgba(0,0,0,.35); --shadow-lg: 0 12px 32px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #15211D; --paper-sunken: #101A17; --surface: #1D2C27; --border: #2B3D37; --border-strong: #3A4F48;
  --ink: #EFEAE0; --ink-body: #C2CAC4; --ink-muted: #8D9891; --ink-faint: #66716B;
  --pine: #EFEAE0; --pine-hover: #FFFFFF; --pine-soft: #24352F; --on-pine: #172621;
  --ochre: #DFAC52; --ochre-hover: #E9BC6E; --ochre-soft: #35301F; --on-ochre: #1C1608;
  --logo-word: #EFEAE0;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow-md: 0 4px 16px rgba(0,0,0,.35); --shadow-lg: 0 12px 32px rgba(0,0,0,.45);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 88px; }
body {
  margin: 0; background: var(--paper); color: var(--ink-body);
  font: 400 16px/1.625 var(--font-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow-x: clip;
}
img, svg, canvas { max-width: 100%; }
[hidden] { display: none !important; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ochre); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.wrap { width: 100%; max-width: 1200px; margin-inline: auto; padding-inline: var(--gutter); }
.lockup { display: block; aspect-ratio: 1993 / 311; height: auto; --mk: var(--logo-mark); --wd: var(--logo-word); }
.markicon { display: block; aspect-ratio: 1; --mk: var(--logo-mark); }

/* ---------- Frame type ---------- */
.f-eyebrow { font: 600 12px/1.4 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--ochre); margin: 0; }
.f-label { font: 600 12px/1.4 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-muted); margin: 0; }
.f-display { font: 500 clamp(44px, 6.6vw, 92px)/1.0 var(--font-display); letter-spacing: -.01em; color: var(--ink); margin: 0; text-wrap: balance; font-variation-settings: "opsz" 60; }
.f-h2 { font: 500 clamp(30px, 3.6vw, 44px)/1.1 var(--font-display); letter-spacing: -.01em; color: var(--ink); margin: 0; text-wrap: balance; }
.f-lede { font-size: clamp(18px, 1.6vw, 20px); line-height: 1.6; color: var(--ink-body); margin: 0; max-width: 60ch; text-wrap: pretty; }
.f-small { font-size: 14px; line-height: 1.5; color: var(--ink-muted); margin: 0; }

/* ---------- Frame buttons (Mesura v1.0) ---------- */
.f-btn { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 22px; border-radius: var(--radius-pill);
  font: 500 16px/1 var(--font-body); text-decoration: none; border: 1px solid transparent; cursor: pointer;
  transition: background-color .22s var(--ease), border-color .22s var(--ease), transform .22s var(--ease); }
.f-btn--primary { background: var(--pine); color: var(--on-pine); }
.f-btn--primary:hover { background: var(--pine-hover); }
.f-btn--secondary { background: var(--surface); color: var(--ink); border-color: var(--border-strong); }
.f-btn--secondary:hover { border-color: var(--ink-faint); }
.f-btn svg { width: 16px; height: 16px; flex: none; }

/* ---------- Sticky reel navigation (restyles itself for each chapter) ---------- */
.reelnav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 60; padding-block: 12px; pointer-events: none;
  --nav-bg: color-mix(in srgb, var(--paper) 82%, transparent); --nav-fg: var(--ink); --nav-muted: var(--ink-muted);
  --nav-line: var(--border); --nav-act-bg: var(--pine); --nav-act-fg: var(--on-pine); --nav-mk: var(--logo-mark); --nav-wd: var(--logo-word); }
.reelnav-pill { pointer-events: auto; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 10px 0 22px;
  border-radius: var(--radius-pill); border: 1px solid var(--nav-line); background: var(--nav-bg); color: var(--nav-fg);
  -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
  transition: background-color .5s var(--ease), border-color .5s var(--ease), color .5s var(--ease); }
.reelnav-logo { flex: none; display: block; width: 118px; }
.reelnav-logo .lockup { width: 100%; --mk: var(--nav-mk); --wd: var(--nav-wd); }
.reelnav-list { flex: 1 1 auto; min-width: 0; display: flex; justify-content: center; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.reelnav-list::-webkit-scrollbar { display: none; }
.reelnav-list a { flex: none; display: inline-flex; align-items: baseline; gap: 6px; padding: 8px 12px; border-radius: var(--radius-pill);
  text-decoration: none; font: 500 14px/1 var(--font-body); color: var(--nav-fg); white-space: nowrap;
  transition: background-color .3s var(--ease), color .3s var(--ease); }
.reelnav-list a i { font-style: normal; font: 500 11px/1 var(--font-mono); color: var(--nav-muted); transition: color .3s var(--ease); }
.reelnav-list a:hover { background: color-mix(in srgb, var(--nav-fg) 8%, transparent); }
.reelnav-list a[aria-current="true"] { background: var(--nav-act-bg); color: var(--nav-act-fg); }
.reelnav-list a[aria-current="true"] i { color: inherit; opacity: .7; }
.reelnav-theme { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%;
  border: 1px solid var(--nav-line); background: transparent; color: var(--nav-fg); cursor: pointer; }
.reelnav-theme svg { width: 18px; height: 18px; }
.reelnav[data-ch="almanac"]   { --nav-bg: rgba(243,236,221,.86); --nav-fg: #1D4A43; --nav-muted: #6E7A73; --nav-line: rgba(29,74,67,.18); --nav-act-bg: #1D4A43; --nav-act-fg: #F3ECDD; --nav-wd: #1D4A43; }
.reelnav[data-ch="hallmark"]  { --nav-bg: rgba(244,238,225,.9); --nav-fg: #22362F; --nav-muted: #7A6A48; --nav-line: rgba(140,100,32,.35); --nav-act-bg: #1D4A43; --nav-act-fg: #EBCB84; --nav-wd: #1D4A43; }
.reelnav[data-ch="madum"]     { --nav-bg: rgba(239,228,204,.9); --nav-fg: #1D4A43; --nav-muted: #6E7A73; --nav-line: rgba(29,74,67,.2); --nav-act-bg: #1D4A43; --nav-act-fg: #EFE4CC; --nav-wd: #1D4A43; }
.reelnav[data-ch="tolerance"] { --nav-bg: rgba(7,61,68,.86); --nav-fg: #EFEAE0; --nav-muted: rgba(239,234,224,.55); --nav-line: rgba(239,234,224,.22); --nav-act-bg: #E1A23C; --nav-act-fg: #073D44; --nav-wd: #EFEAE0; }
.reelnav[data-ch="dial"]      { --nav-bg: rgba(236,232,224,.9); --nav-fg: #2B2F2C; --nav-muted: #7D7F78; --nav-line: rgba(43,47,44,.14); --nav-act-bg: #E1A23C; --nav-act-fg: #2B2F2C; --nav-wd: #2B2F2C; }
.reelnav[data-ch="datum"]     { --nav-bg: rgba(251,250,247,.9); --nav-fg: #0F1F1B; --nav-muted: #7A827E; --nav-line: rgba(15,31,27,.12); --nav-act-bg: #0F1F1B; --nav-act-fg: #FBFAF7; --nav-wd: #0F1F1B; }
.reelnav[data-ch="constant"]  { --nav-bg: rgba(10,22,19,.72); --nav-fg: #EFEAE0; --nav-muted: rgba(239,234,224,.5); --nav-line: rgba(239,234,224,.16); --nav-act-bg: #EFEAE0; --nav-act-fg: #07110F; --nav-wd: #EFEAE0; }
@media (max-width: 1080px) { .reelnav-list a span { display: none; } .reelnav-list a { padding: 8px 10px; } .reelnav-list a i { font-size: 12px; color: inherit; } }
@media (max-width: 640px) {
  .reelnav-pill { height: 52px; padding-left: 14px; gap: 8px; }
  .reelnav-logo { width: 30px; }
  .reelnav-logo .lockup { display: none; }
  .reelnav-logo .markicon { display: block !important; width: 28px; }
  .reelnav-list { justify-content: flex-start; }
}

/* ---------- Cover ---------- */
.cover { padding-block: clamp(28px, 5vw, 64px) clamp(40px, 6vw, 72px); }
.cover-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: clamp(28px, 5vw, 72px); align-items: center; }
.cover-copy { display: grid; gap: 24px; min-width: 0; }
.cover-actions { display: flex; flex-wrap: wrap; gap: 12px; }
.cover-meta { display: flex; flex-wrap: wrap; gap: 8px 20px; font: 500 12px/1.4 var(--font-mono); color: var(--ink-muted); letter-spacing: .02em; }
.cover-meta b { color: var(--ink); font-weight: 600; }
.stage { position: relative; width: 100%; max-width: 460px; justify-self: center; }
.stage-plates { position: relative; aspect-ratio: 1; border-radius: 28px; overflow: hidden; box-shadow: var(--shadow-lg); background: var(--paper-sunken); }
.stage-plates > .plate { position: absolute; inset: 0; opacity: 0; transition: opacity .9s var(--ease), transform 1.2s var(--ease-out); transform: scale(1.04); }
.stage-plates > .plate.is-on { opacity: 1; transform: scale(1); }
.stage-plates > .plate svg { width: 100%; height: 100%; display: block; }
.stage-caption { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
.stage-caption p { margin: 0; font: 500 15px/1.3 var(--font-body); color: var(--ink); }
.stage-caption p span { color: var(--ink-muted); font-weight: 400; }
.stage-dots { display: flex; gap: 6px; }
.stage-dots button { width: 22px; height: 22px; border-radius: 50%; border: 0; background: none; padding: 0; cursor: pointer; display: grid; place-items: center; }
.stage-dots button::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); transition: background-color .3s, transform .3s; }
.stage-dots button[aria-pressed="true"]::before { background: var(--ochre); transform: scale(1.35); }

/* ---------- Timeline table of contents (log scale) ---------- */
.timeline { margin-top: clamp(40px, 6vw, 72px); border-top: 1px solid var(--border); padding-top: 20px; }
.timeline-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
.timeline-axis { position: relative; height: 236px; margin-top: 8px; }
.timeline-rule { position: absolute; left: 0; right: 0; top: 112px; height: 1px; background: var(--ink-faint); }
.timeline-ticks { position: absolute; inset: 0; pointer-events: none; }
.timeline-ticks i { position: absolute; top: 109px; width: 1px; height: 7px; background: var(--ink-faint); }
.timeline-ticks i.major { top: 105px; height: 15px; background: var(--ink-muted); }
.timeline-ticks b { position: absolute; bottom: 0; transform: translateX(-50%); font: 500 11px/1 var(--font-mono); color: var(--ink-muted); white-space: nowrap; }
.tl-item { position: absolute; left: var(--x); top: 0; height: 112px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; text-decoration: none; color: var(--ink); }
.tl-item::after { content: ""; width: 1px; height: 12px; background: var(--ink); flex: none; }
.tl-item.down { top: 113px; height: auto; justify-content: flex-start; }
.tl-item.down::after { order: -1; }
.tl-item .tl-plate { width: 40px; height: 40px; border-radius: 10px; overflow: hidden; box-shadow: var(--shadow-sm); transition: transform .3s var(--ease-out); background: var(--paper-sunken); flex: none; }
.tl-item .tl-plate svg { width: 100%; height: 100%; display: block; }
.tl-item:hover .tl-plate { transform: translateY(-3px) scale(1.06); }
.tl-item.down:hover .tl-plate { transform: translateY(3px) scale(1.06); }
.tl-text { text-align: center; line-height: 1.15; }
.tl-text strong { display: block; font: 500 15px/1.15 var(--font-display); color: var(--ink); white-space: nowrap; }
.tl-text small { display: block; font: 500 10.5px/1.3 var(--font-mono); color: var(--ink-muted); white-space: nowrap; }
.timeline-list { display: none; }
@media (max-width: 860px) {
  .cover-grid { grid-template-columns: minmax(0, 1fr); }
  .stage { max-width: 380px; }
  .timeline-axis { display: none; }
  .timeline-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 16px 0 0; padding: 0; list-style: none; }
  .timeline-list a { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); text-decoration: none; }
  .timeline-list .tl-plate { width: 36px; height: 36px; border-radius: 8px; overflow: hidden; flex: none; background: var(--paper-sunken); }
  .timeline-list .tl-plate svg { width: 100%; height: 100%; display: block; }
  .timeline-list strong { display: block; font: 500 15px/1.2 var(--font-display); color: var(--ink); }
  .timeline-list small { display: block; font: 500 11px/1.3 var(--font-mono); color: var(--ink-muted); }
}

/* ---------- Invariants ---------- */
.invariants { padding-block: clamp(48px, 7vw, 96px); background: var(--paper-sunken); border-block: 1px solid var(--border); }
.inv-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px 48px; align-items: end; margin-bottom: 36px; }
.inv-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.inv { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; display: grid; grid-template-rows: 150px auto; gap: 18px; min-width: 0; }
.inv-vis { display: grid; place-items: center; border-radius: var(--radius-md); background: var(--paper); overflow: hidden; }
.inv h3 { margin: 0 0 4px; font: 600 15px/1.3 var(--font-body); color: var(--ink); }
.inv p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--ink-muted); }
.inv-swatches { display: grid; grid-template-columns: 1.4fr 1.4fr 1fr 1fr; width: 100%; height: 100%; }
.inv-swatches span { display: flex; align-items: flex-end; padding: 8px; font: 500 10px/1.2 var(--font-mono); }
.inv-trio { display: flex; gap: 18px; align-items: baseline; font: 500 36px/1 var(--font-display); letter-spacing: -.01em; }
.inv-quote { font: 500 17px/1.35 var(--font-display); color: var(--ink); padding: 0 20px; text-align: left; margin: 0; }
@media (max-width: 960px) { .inv-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .inv-head { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) { .inv-grid { grid-template-columns: minmax(0, 1fr); } }

/* ---------- Shared chapter chrome ---------- */
.ch { position: relative; overflow: clip; }
.ch-tag { display: inline-flex; align-items: center; gap: 10px; font: 500 12px/1 var(--font-mono); letter-spacing: .04em; }
.ch-tag i { font-style: normal; display: inline-grid; place-items: center; min-width: 28px; height: 22px; padding: 0 6px; border-radius: 6px; border: 1px solid currentColor; }
.ch-note { font: 500 11px/1.4 var(--font-mono); letter-spacing: .02em; opacity: .7; }

/* ---------- Closing ---------- */
.closing { padding-block: clamp(56px, 8vw, 112px); }
.closing-head { display: grid; gap: 16px; max-width: 760px; margin-bottom: 36px; }
.colophon { border-top: 1px solid var(--border); padding-block: 32px 48px; }
.colophon-grid { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 32px; }
.colophon p { margin: 0; font-size: 13px; color: var(--ink-muted); max-width: 70ch; }
.colophon .lockup { width: 150px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  html { scroll-behavior: auto; }
}
