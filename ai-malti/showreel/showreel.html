const fmt = (t) => `0:${String(Math.floor(t)).padStart(2, '0')}${t % 1 ? '.' + String(Math.round((t % 1) * 100)).padStart(2, '0').replace(/0$/, '') : ''}`;
let shots = [];

function show(key) {
  const d = EP[key];
  document.body.dataset.ep = key;
  document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.ep === key)));
  $('slug').textContent = d.slug;
  $('title').innerHTML = d.title;
  $('lede').textContent = d.lede;
  $('intro').textContent = d.intro;
  $('facts').replaceChildren(...d.facts.map((f) => Object.assign(document.createElement('li'), { textContent: f })));
  film.src = d.video; film.poster = d.poster; film.setAttribute('aria-label', d.label);
  film.play().catch(() => {});
  shots = d.shots;
  rows.replaceChildren(...d.shots.map(([t, mt, en, fx]) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="tc"><button type="button" aria-label="Jump to ${fmt(t)}">${fmt(t)}</button></td><td class="mt"></td><td class="en"></td><td class="fx"></td>`;
    tr.querySelector('.mt').textContent = mt;
    tr.querySelector('.en').textContent = en;
    tr.querySelector('.fx').textContent = fx;
    tr.querySelector('button').addEventListener('click', () => { film.currentTime = t; film.play().catch(() => {}); });
    return tr;
  }));
  $('craft').replaceChildren(...d.craft.map(([h, p]) => { const div = document.createElement('div'); div.innerHTML = '<h3></h3><p></p>'; div.querySelector('h3').textContent = h; div.querySelector('p').innerHTML = p; return div; }));
  $('cap').textContent = d.cap;
  $('tags').textContent = d.tags;
  $('tips').innerHTML = d.tips.map((t) => `<li>${t}</li>`).join('');
  $('foot').replaceChildren(...d.foot.map((f) => Object.assign(document.createElement('span'), { textContent: f })));
  if (location.hash !== '#ep' + key) history.replaceState(null, '', '#ep' + key);
}
document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => show(b.dataset.ep)));
film.addEventListener('timeupdate', () => {
  const t = film.currentTime;
  let cur = 0;
  shots.forEach(([s], i) => { if (t >= s) cur = i; });
  [...rows.children].forEach((tr, i) => tr.classList.toggle('now', i === cur));
});
const sound = $('sound');
sound.addEventListener('click', () => {
  film.muted = !film.muted;
  if (!film.muted) film.play().catch(() => {});
  sound.textContent = film.muted ? 'Ixgħel il-ħoss · Sound on' : 'Itfi l-ħoss · Mute';
});
$('restart').addEventListener('click', () => { film.currentTime = 0; film.play().catch(() => {}); });
document.querySelectorAll('[data-copy]').forEach((b) => b.addEventListener('click', async () => {
  const el = $(b.dataset.copy);
  const label = b.textContent;
  try { await navigator.clipboard.writeText(el.textContent.trim()); b.textContent = 'Copied'; }
  catch (e) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Selected: press Ctrl/⌘+C'; }
  setTimeout(() => (b.textContent = label), 1800);
}));
show(location.hash === '#ep01' ? '01' : '02');
</script>
